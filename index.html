<!-- PWA Manifest (inline) -->
<script>
const manifestData = {
  name: "日中翻譯 — Japanese to Chinese",
  short_name: "日中翻譯",
  description: "日文翻譯繁體中文，支援文字與圖片辨識",
  start_url: "./",
  display: "standalone",
  background_color: "#1a1a2e",
  theme_color: "#1a1a2e",
  orientation: "portrait",
  icons: [
    { src: "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="40" fill="#1a1a2e"/><text x="96" y="130" font-size="110" text-anchor="middle" fill="#c8b8f0" font-family="serif">日</text></svg>`), sizes: "192x192", type: "image/svg+xml" },
    { src: "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="100" fill="#1a1a2e"/><text x="256" y="350" font-size="300" text-anchor="middle" fill="#c8b8f0" font-family="serif">日</text></svg>`), sizes: "512x512", type: "image/svg+xml" }
  ]
};
const blob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
const manifestURL = URL.createObjectURL(blob);
const link = document.createElement('link');
link.rel = 'manifest';
link.href = manifestURL;
document.head.appendChild(link);
</script>

<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --accent: #c8b8f0;
    --accent2: #9d8dc4;
    --text: #f0ecff;
    --text2: #a09bb8;
    --text3: #5c5878;
    --border: rgba(200,184,240,0.12);
    --border2: rgba(200,184,240,0.22);
    --success: #6fcf97;
    --danger: #eb5757;

    --radius-sm: 10px;
  }

  html, body {
    height: 100%;

  body {

  /* ── Status bar spacer for notch phones ── */

    height: env(safe-area-inset-top, 0px);
    background: var(--bg);
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px 10px;
    border-bottom: 0.5px solid var(--border);
  }
  .header-logo {
    display: flex;

  }
  .logo-icon {

  }
  .logo-text {
    font-size: 17px;
    font-weight: 600;

  }
  .logo-sub {

  }
  .header-btn {
    width: 36px;
    height: 36px;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text2);
    font-size: 18px;
    transition: background 0.15s;
  }
  .header-btn:active { background: var(--surface2); }

  /* ── Tabs ── */
  .tabs {
    display: flex;
    padding: 10px 20px 0;
    gap: 4px;
    border-bottom: 0.5px solid var(--border);
  }
  .tab {

    font-size: 13px;

    background: none;

  .tab.active {

  /* ── Scroll body ── */
  .scroll-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 100px;
    -webkit-overflow-scrolling: touch;
  }

  /* ── Lang bar ── */
  .lang-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }
  .lang-pill {
    flex: 1;

    font-size: 14px;

  .section-label {

    font-weight: 600;

  .settings-row {

  .settings-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }

  .api-input::placeholder { color: var(--text3); }
  .save-btn {

</style>

<script>
// ── State ──
let currentTab = 'text';
let currentImageBase64 = null;
const API_URL = 'https://api.anthropic.com/v1/messages';

// ── Init ──
window.addEventListener('load', () => {
  const saved = localStorage.getItem('apiKey');
  if (saved) document.getElementById('apiKeyInput').value = saved;
  renderHistory();
  checkOffline();
});
window.addEventListener('online', checkOffline);
window.addEventListener('offline', checkOffline);

function checkOffline() {
  document.getElementById('offlineBadge').classList.toggle('show', !navigator.onLine);
}

function getApiKey() {
  return localStorage.getItem('apiKey') || '';
}

function saveApiKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key) { showToast('請輸入 API Key'); return; }
  localStorage.setItem('apiKey', key);
  showToast('已儲存 ✓');
}

// ── Tabs ──
function switchTab(tab, tabEl, navId) {
  currentTab = tab;
  document.getElementById('settingsPanel').classList.remove('show');
  ['text','image','history'].forEach(t => {
    document.getElementById('tab-' + t).style.display = t === tab ? 'block' : 'none';
  });
  document.querySelectorAll('.tab').forEach((el, i) => {
    el.classList.toggle('active', ['text','image','history'][i] === tab);
  });
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const activeNav = navId || 'nav-' + tab;
  const navEl = document.getElementById(activeNav);
  if (navEl) navEl.classList.add('active');
  if (tab === 'history') renderHistory();
}

function showSettings() {
  const panel = document.getElementById('settingsPanel');
  const showing = panel.classList.contains('show');
  ['text','image','history'].forEach(t => document.getElementById('tab-' + t).style.display = 'none');
  if (showing) {
    panel.classList.remove('show');
    document.getElementById('tab-' + currentTab).style.display = 'block';
  } else {
    panel.classList.add('show');
  }
}

// ── Text translation ──
function updateCount() {
  const len = document.getElementById('jpInput').value.length;
  document.getElementById('charCount').textContent = len;
}
function clearText() {
  document.getElementById('jpInput').value = '';
  updateCount();
  document.getElementById('resultCard').classList.remove('show');
}
async function pasteClipboard() {
  try {
    const text = await navigator.clipboard.readText();
    document.getElementById('jpInput').value = text;
    updateCount();
  } catch { showToast('無法讀取剪貼板'); }
}
function pasteDemo() {
  document.getElementById('jpInput').value = 'いただきます。今日は本当にいい天気ですね。どこかに出かけませんか？';
  updateCount();
}

async function doTranslate() {
  const input = document.getElementById('jpInput').value.trim();
  if (!input) { showToast('請輸入日文'); return; }
  const key = getApiKey();
  if (!key) { showToast('請先在設定中輸入 API Key'); showSettings(); return; }

  const btn = document.getElementById('translateBtn');
  btn.classList.add('loading');
  btn.innerHTML = '<span class="spinner"></span> 翻譯中…';
  document.getElementById('resultCard').classList.remove('show');

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: `你是專業的日中翻譯員，請將以下日文翻譯成自然流暢的繁體中文。
只回傳 JSON（不含 markdown 代碼框），格式：
{"translation":"翻譯結果","note":"語氣或文化補充，若無則空字串"}

日文：${input}`
        }]
      })
    });
    if (!res.ok) throw new Error('API ' + res.status);
    const data = await res.json();
    const raw = (data.content || []).map(b => b.text || '').join('');
    const parsed = JSON.parse(raw.replace(/```json|```/g, '').trim());
    showTextResult(parsed.translation, parsed.note);
    saveHistory(input, parsed.translation, 'text');
  } catch(e) {
    showTextResult('翻譯失敗：' + e.message, '');
  }

  btn.classList.remove('loading');
  btn.innerHTML = '<i class="ti ti-language"></i> 立即翻譯';
}

function showTextResult(translation, note) {
  document.getElementById('resultText').textContent = translation;
  const noteEl = document.getElementById('resultNote');
  if (note) {
    noteEl.textContent = '💡 ' + note;
    noteEl.style.display = 'block';
  } else {
    noteEl.style.display = 'none';
  }
  document.getElementById('resultCard').classList.add('show');
  document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function copyResult() {
  const t = document.getElementById('resultText').textContent;
  navigator.clipboard.writeText(t).then(() => showToast('已複製 ✓')).catch(() => showToast('複製失敗'));
}
function speakResult() {
  const t = document.getElementById('resultText').textContent;
  if (!t) return;
  const utt = new SpeechSynthesisUtterance(t);
  utt.lang = 'zh-TW';
  speechSynthesis.speak(utt);
}

// ── Image translation ──
function handleImageUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const dataUrl = ev.target.result;
    currentImageBase64 = dataUrl.split(',')[1];
    const img = document.getElementById('previewImg');
    img.src = dataUrl;
    img.style.display = 'block';
    document.getElementById('imgTranslateBtn').style.display = 'flex';
    document.getElementById('imgResultCard').classList.remove('show');
    document.querySelector('.image-upload-area').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

async function doImageTranslate() {
  if (!currentImageBase64) return;
  const key = getApiKey();
  if (!key) { showToast('請先在設定中輸入 API Key'); showSettings(); return; }

  const btn = document.getElementById('imgTranslateBtn');
  btn.classList.add('loading');
  btn.innerHTML = '<span class="spinner"></span> 辨識中…';
  document.getElementById('imgResultCard').classList.remove('show');

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1500,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: currentImageBase64 } },
            { type: 'text', text: `請辨識圖片中所有日文文字，並翻譯成繁體中文。
只回傳 JSON（不含 markdown 代碼框）：
{"original":"原始日文（若有多行用 \\n 分隔）","translation":"對應的繁體中文翻譯","note":"若有特別說明如菜單、路牌等背景"}` }
          ]
        }]
      })
    });
    if (!res.ok) throw new Error('API ' + res.status);
    const data = await res.json();
    const raw = (data.content || []).map(b => b.text || '').join('');
    const parsed = JSON.parse(raw.replace(/```json|```/g, '').trim());
    showImgResult(parsed.translation, parsed.original, parsed.note);
    saveHistory(parsed.original || '（圖片）', parsed.translation, 'image');
  } catch(e) {
    showImgResult('辨識失敗：' + e.message, '', '');
  }

  btn.classList.remove('loading');
  btn.innerHTML = '<i class="ti ti-photo-scan"></i> 辨識並翻譯';
}

function showImgResult(translation, original, note) {
  document.getElementById('imgResultText').textContent = translation;
  const noteEl = document.getElementById('imgResultNote');
  const parts = [];
  if (original) parts.push('原文：' + original);
  if (note) parts.push('💡 ' + note);
  if (parts.length) {
    noteEl.textContent = parts.join('\n');
    noteEl.style.display = 'block';
  } else {
    noteEl.style.display = 'none';
  }
  document.getElementById('imgResultCard').classList.add('show');
}
function copyImgResult() {
  const t = document.getElementById('imgResultText').textContent;
  navigator.clipboard.writeText(t).then(() => showToast('已複製 ✓')).catch(() => showToast('複製失敗'));
}

// ── History ──
function saveHistory(src, tgt, type) {
  const history = JSON.parse(localStorage.getItem('history') || '[]');
  history.unshift({ src, tgt, type, ts: Date.now() });
  if (history.length > 50) history.pop();
  localStorage.setItem('history', JSON.stringify(history));
}
function renderHistory() {
  const history = JSON.parse(localStorage.getItem('history') || '[]');
  const list = document.getElementById('historyList');
  if (!history.length) {
    list.innerHTML = '<div class="h-empty">尚無翻譯紀錄</div>';
    return;
  }
  list.innerHTML = history.map(h => `
    <div class="history-item" onclick="reuseHistory(${JSON.stringify(h.src).replace(/'/g,"&#39;")})">
      <div class="h-icon"><i class="ti ti-${h.type === 'image' ? 'photo' : 'language'}"></i></div>
      <div class="h-texts">
        <div class="h-src">${escHtml(h.src)}</div>
        <div class="h-tgt">${escHtml(h.tgt)}</div>
      </div>
    </div>`).join('');
}
function reuseHistory(src) {
  switchTab('text');
  document.getElementById('jpInput').value = src;
  updateCount();
  document.getElementById('resultCard').classList.remove('show');
}
function clearHistory() {
  if (!confirm('確定要清除所有紀錄？')) return;
  localStorage.removeItem('history');
  renderHistory();
  showToast('已清除 ✓');
}
function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Toast ──
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ── Service Worker (inline) ──
const swCode = `
const CACHE = 'jptrans-v1';
const ASSETS = ['./', './index.html'];
self.addEventListener('install', e => {
  e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)));
  self.skipWaiting();
});
self.addEventListener('activate', e => {
  e.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))));
  self.clients.claim();
});
self.addEventListener('fetch', e => {
  if (e.request.url.includes('api.anthropic.com')) return;
  e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
});
`;
const swBlob = new Blob([swCode], { type: 'application/javascript' });
const swUrl = URL.createObjectURL(swBlob);
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register(swUrl).catch(() => {});
}
